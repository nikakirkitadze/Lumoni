<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumoni</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0F172A;
      color: #E2E8F0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .container { max-width: 400px; padding: 40px 20px; }
    h1 {
      background: linear-gradient(135deg, #818CF8, #6366F1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 48px;
      margin-bottom: 8px;
    }
    p { color: #94A3B8; font-size: 16px; line-height: 1.5; }
    .check { font-size: 64px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="check">&#10003;</div>
    <h1>Lumoni</h1>
    <p>If you're signing in, open this link on your device with the Lumoni app installed.</p>
    <p style="margin-top: 24px; font-size: 14px; color: #64748B;">
      If the app didn't open automatically, copy this page's URL and paste it into the app.
    </p>
  </div>
</body>
</html>
